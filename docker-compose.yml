services:
  # ==========================================
  # 1. Frontend Service (Vite React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
    container_name: chesso-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chesso_network

  # ==========================================
  # 2. Backend Service (Express + Socket.IO)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chesso-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/chesso
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:80}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:80,http://localhost:5173,http://localhost}
      - JWT_SECRET=${JWT_SECRET:-chesso_super_secret_jwt_key_2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder_id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-placeholder_secret}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - chesso_network

  # ==========================================
  # 3. Database Service (MongoDB)
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: chesso-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chesso_network

  # ==========================================
  # 4. In-Memory Cache & Rate Limiting (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: chesso-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    networks:
      - chesso_network

# ==========================================
# Networks & Volumes
# ==========================================
networks:
  chesso_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
